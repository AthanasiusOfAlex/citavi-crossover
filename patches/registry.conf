# Registry fixes applied to the bottle by `citavi-crossover registry`.
# One fix per line, fields separated by " | ":
#
#   id | key | value name | type | data | why
#
# - type KEY means "just make sure the key exists" (value name and data are ignored; write -).
# - type FONT is a Windows system font, written as "<face name> <size in points>".
# - Keys under HKLM are written to both the 64-bit and the 32-bit registry view.
# - Lines starting with # and blank lines are ignored.

dotnet-481-release | HKLM\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full | Release | REG_DWORD | 533320 | Citavi 7.4+ refuses to start unless .NET Framework 4.8.1 (Release >= 533320) is installed. CrossOver ships 4.8 (528049); Citavi runs fine on it, so report 4.8.1.
dotnet-481-version | HKLM\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full | Version | REG_SZ | 4.8.09032 | Keeps the version string consistent with the Release value above.
hkcu-classes-key | HKCU\Software\Classes | - | KEY | - | Citavi opens HKCU\Software\Classes at startup to register the citavi: URL scheme and crashes with NullReferenceException (RegistryHelper.RegisterCustomUriScheme) because a fresh Wine prefix has no such key.
wpf-software-rendering | HKCU\Software\Microsoft\Avalon.Graphics | DisableHWAcceleration | REG_DWORD | 1 | The PDF preview is a WPF control; with hardware acceleration WPF paints nothing under Wine on Apple Silicon. Software rendering works.


# Fonts. Citavi is designed around Segoe UI, which only Windows has. Selawik is Microsoft's
# open-source font with the same letter widths and line heights. Bottle UI (in fonts/, copied into
# the bottle by `citavi-crossover fonts`) is Selawik with what it lacks added from Open Sans and
# Noto Sans: the no-break space, Greek, Cyrillic and Hebrew letters, and italics; see fonts/README.md.
# Retina mode is a setting, not a fix: see RETINA in config.sh.
segoe-ui | HKCU\Software\Wine\Fonts\Replacements | Segoe UI | REG_SZ | Bottle UI | Citavi asks for Segoe UI by name in most dialogs. Without a replacement Wine picks Tahoma, which is narrower and has shorter lines, so text looks cramped and unlike Citavi on Windows.
segoe-ui-light | HKCU\Software\Wine\Fonts\Replacements | Segoe UI Light | REG_SZ | Bottle UI Light | Same, for the light weight.
segoe-ui-semilight | HKCU\Software\Wine\Fonts\Replacements | Segoe UI Semilight | REG_SZ | Bottle UI Semilight | Same, for the semilight weight (Citavi uses it for some headings).
segoe-ui-semibold | HKCU\Software\Wine\Fonts\Replacements | Segoe UI Semibold | REG_SZ | Bottle UI Semibold | Same, for the semibold weight.
system-font-message | HKCU\Control Panel\Desktop\WindowMetrics | MessageFont | FONT | Segoe UI 9 | Citavi's default font is whatever Windows reports as the message box font (Environment.GetDefaultFont returns SystemFonts.MessageBoxFont). Windows 10 says Segoe UI 9 pt; a fresh Wine bottle says Tahoma 8 pt, so the whole interface came out in small Tahoma.
system-font-menu | HKCU\Control Panel\Desktop\WindowMetrics | MenuFont | FONT | Segoe UI 9 | The other system fonts, set to their Windows 10 values for the same reason.
system-font-status | HKCU\Control Panel\Desktop\WindowMetrics | StatusFont | FONT | Segoe UI 9 | See system-font-menu.
system-font-icon | HKCU\Control Panel\Desktop\WindowMetrics | IconFont | FONT | Segoe UI 9 | See system-font-menu.
system-font-caption | HKCU\Control Panel\Desktop\WindowMetrics | CaptionFont | FONT | Segoe UI 9 | See system-font-menu.
system-font-small-caption | HKCU\Control Panel\Desktop\WindowMetrics | SmCaptionFont | FONT | Segoe UI 9 | See system-font-menu.
